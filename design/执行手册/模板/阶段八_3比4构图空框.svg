<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img"><title>阶段八3比4构图空框模板</title><desc>三个180乘240的空白目标画框。整张板为排版页，不是最终画幅。未填写、未验证作品。</desc><rect width="900" height="440" fill="#f1eee7"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#243746"><text x="30" y="38" font-size="24">阶段八｜3:4目标画框（空白练习模板）</text><text x="30" y="66" font-size="16">每框180×240；与1800×2400同为3:4。整张模板页不是最终插画。</text><text x="60" y="96" font-size="18">A 侧前方</text><rect id="frame-60" x="60" y="110" width="180" height="240" fill="#fff" stroke="#243746" stroke-width="2"/><text x="60" y="377" font-size="15">事件__ / 裁切损失__</text><text x="350" y="96" font-size="18">B 来者位置</text><rect id="frame-350" x="350" y="110" width="180" height="240" fill="#fff" stroke="#243746" stroke-width="2"/><text x="350" y="377" font-size="15">事件__ / 裁切损失__</text><text x="640" y="96" font-size="18">C 高处</text><rect id="frame-640" x="640" y="110" width="180" height="240" fill="#fff" stroke="#243746" stroke-width="2"/><text x="640" y="377" font-size="15">事件__ / 裁切损失__</text><text x="30" y="410" font-size="15">重新在目标框内摆构图，不拉伸原示意；单独导出框内区域，再做180×240实际读取检查。</text></g></svg>