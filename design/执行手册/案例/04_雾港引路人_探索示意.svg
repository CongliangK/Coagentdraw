ate(250 1550) scale(0.8)"><circle cx="0" cy="-162" r="22" fill="#bca88f"/><path d="M-39,-130 L39,-130 L47,-35 L-47,-35 Z" fill="#415d69"/><path d="M-19,-35 L-30,65" fill="none" stroke="#415d69" stroke-width="24" stroke-linecap="round"/><path d="M19,-35 L35,65" fill="none" stroke="#415d69" stroke-width="24" stroke-linecap="round"/><path d="M-32,-115 L-57,-48" fill="none" stroke="#415d69" stroke-width="15" stroke-linecap="round"/><path d="M32,-115 L74,-82 L102,-104" fill="none" stroke="#415d69" stroke-width="15" stroke-linecap="round"/><circle cx="102" cy="-104" r="9" fill="#bca88f"/><path d="M-88,-130 L-30,-82" stroke="#415d69" stroke-width="9"/><circle cx="-88" cy="-160" r="31" fill="none" stroke="#edc783" stroke-width="12"/></g><rect x="425" y="1345" width="365" height="285" fill="#26333f" stroke="#bac5cc"/><g transform="translate(635 1550) scale(0.8)"><circle cx="0" cy="-162" r="22" fill="#bca88f"/><path d="M-39,-130 L39,-130 L47,-35 L-47,-35 Z" fill="#415d69"/><path d="M-19,-35 L-30,65" fill="none" stroke="#415d69" stroke-width="24" stroke-linecap="round"/><path d="M19,-35 L35,65" fill="none" stroke="#415d69" stroke-width="24" stroke-linecap="round"/><path d="M-32,-115 L-57,-48" fill="none" stroke="#415d69" stroke-width="15" stroke-linecap="round"/><path d="M32,-115 L74,-82 L102,-104" fill="none" stroke="#415d69" stroke-width="15" stroke-linecap="round"/><circle cx="102" cy="-104" r="9" fill="#bca88f"/><path d="M-88,-130 L-30,-82" stroke="#415d69" stroke-width="9"/><circle cx="-88" cy="-160" r="31" fill="none" stroke="#edc783" stroke-width="12"/></g><rect x="810" y="1345" width="740" height="285" fill="#fff" stroke="#bac5cc"/><text x="835" y="1385" font-size="24">远看问题：肩灯、头、空手能否分开？</text><text x="835" y="1430" font-size="24">近看问题：支架如何固定，动作会不会相撞？</text><text x="835" y="1480" font-size="22">这里只展示图形关系，不声称真人识别通过。</text><text x="835" y="1530" font-size="22">B缺结构/灰阶/配色；C仍未做本轮探索。</text><text x="835" y="1580" font-size="22">下一步补证，再由人决定是否进入正式锁定。</text><text x="40" y="1680" font-size="22">图示用途：教会比较与留未知。所有候选保留，不把A1视作获胜者。</text></g></svg>