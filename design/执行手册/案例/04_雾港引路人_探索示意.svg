<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1730" viewBox="0 0 1600 1730" role="img"><title>岑灯四轮探索教学示意</title><desc>A灯外移对照与B腰匣整体重构；A结构动作、灰阶配色、两背景阅读。未作真实作品或工具测试。</desc><rect width="100%" height="100%" fill="#edf1f4"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#243746"><text x="40" y="48" font-size="31">岑灯｜四轮探索教学示意</text><text x="40" y="84" font-size="20">原创几何图，不是模型生成、真实作品或人体/承重验证；观察与未知见配套记录。</text><text x="40" y="126" font-size="25">R1 黑剪影：A0→A1只外移灯；B为整套方案重构</text><rect x="40" y="145" width="490" height="340" fill="#fff" stroke="#bac5cc"/><text x="60" y="177" font-size="21">A0 贴头：暴露粘连</text><g transform="translate(310 375) scale(1)"><circle cx="0" cy="-162" r="22" fill="#000000"/><path d="M-39,-130 L39,-130 L47,-35 L-47,-35 Z" fill="#000000"/><path d="M-19,-35 L-30,65" fill="none" stroke="#000000" stroke-width="24" stroke-linecap="round"/><path d="M19,-35 L35,65" fill="none" stroke="#000000" stroke-width="24" stroke-linecap="round"/><path d="M-32,-115 L-57,-48" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round"/><path d="M32,-115 L54,-40" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round"/><circle cx="54" cy="-40" r="9" fill="#000000"/><path d="M-42,-130 L-30,-82" stroke="#000000" stroke-width="9"/><circle cx="-42" cy="-160" r="31" fill="none" stroke="#000000" stroke-width="12"/></g><text x="60" y="477" font-size="18">同总展示高度、相近中性姿态</text><rect x="550" y="145" width="490" height="340" fill="#fff" stroke="#bac5cc"/><text x="570" y="177" font-size="21">A1 外移：间隙与跨度并存</text><g transform="translate(820 375) scale(1)"><circle cx="0" cy="-162" r="22" fill="#000000"/><path d="M-39,-130 L39,-130 L47,-35 L-47,-35 Z" fill="#000000"/><path d="M-19,-35 L-30,65" fill="none" stroke="#000000" stroke-width="24" stroke-linecap="round"/><path d="M19,-35 L35,65" fill="none" stroke="#000000" stroke-width="24" stroke-linecap="round"/><path d="M-32,-115 L-57,-48" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="ro